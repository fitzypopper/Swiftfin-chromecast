name: "Build 🔨"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        scheme:
          - "Swiftfin"

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set derived data path
        run: |
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "Derived data: $RUNNER_TEMP/DerivedData"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Verify GoogleCast.xcframework
        run: |
          if [ ! -d "Frameworks/GoogleCast.xcframework" ]; then
            echo "ERROR: GoogleCast.xcframework not found"
            exit 1
          fi
          echo "GoogleCast.xcframework found"
          ls -la Frameworks/GoogleCast.xcframework/

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}"

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build (no codesign)
        run: |
          set -o pipefail
          set +e
          xcodebuild build \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "${{ env.DERIVED_DATA_PATH }}" \
            -skipMacroValidation \
            2>&1 | tee build.log | xcpretty
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "== RAW ERROR LINES =="
            grep -n -E "error:|cannot link|cannot parse|not an allowed client|Undefined symbols|codesign|entitlement" build.log | tail -30 || true
            echo "== TAIL 40 RAW =="
            tail -40 build.log || true
          fi
          exit "$status"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Package IPA
        if: success()
        run: |
          APP_PATH="${{ env.DERIVED_DATA_PATH }}/Build/Products/Release-iphoneos/Swiftfin iOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find "${{ env.DERIVED_DATA_PATH }}/Build/Products" -maxdepth 2 | head -40
            exit 1
          fi
          echo "== BUNDLE CONTENTS =="
          find "$APP_PATH" -maxdepth 2 | head -60
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing from built app bundle"
            exit 1
          fi
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist" 2>/dev/null || true)"
          if [ -z "$EXEC" ] || [ ! -x "$APP_PATH/$EXEC" ]; then
            echo "ERROR: executable '$EXEC' missing from built app bundle"
            exit 1
          fi
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/Swiftfin iOS.app"
          ditto -c -k --sequesterRsrc --keepParent Payload Swiftfin.ipa
          ls -lh Swiftfin.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-chromecast
          path: Swiftfin.ipa
          retention-days: 14
