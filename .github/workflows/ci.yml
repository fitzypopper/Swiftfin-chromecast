name: "Build 🔨"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        scheme:
          - "Swiftfin"

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Verify GoogleCast.xcframework
        run: |
          if [ ! -d "Frameworks/GoogleCast.xcframework" ]; then
            echo "ERROR: GoogleCast.xcframework not found"
            exit 1
          fi
          echo "GoogleCast.xcframework found"
          ls -la Frameworks/GoogleCast.xcframework/

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -skipMacroValidation \
            2>&1 | tee build.log | xcpretty
          status="${PIPESTATUS[0]}"
          # Print the raw undefined-symbol block so linker errors are not
          # swallowed by xcpretty's trimmed output.
          if [ "$status" -ne 0 ]; then
            echo "== RAW UNDEFINED SYMBOLS / LINKER OUTPUT =="
            grep -n -A40 'Undefined symbols' build.log || true
            echo "== END RAW OUTPUT =="
          fi
          exit "$status"
