name: "Build 🔨"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        scheme:
          - "Swiftfin"

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Verify GoogleCast.xcframework
        run: |
          if [ ! -d "Frameworks/GoogleCast.xcframework" ]; then
            echo "ERROR: GoogleCast.xcframework not found"
            exit 1
          fi
          echo "GoogleCast.xcframework found"
          ls -la Frameworks/GoogleCast.xcframework/

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build & Archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS' \
            -archivePath "${{ github.workspace }}/Swiftfin.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            -skipMacroValidation \
            2>&1 | tee build.log | xcpretty || true
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            echo "== RAW UNDEFINED SYMBOLS / LINKER OUTPUT =="
            grep -n -A40 'Undefined symbols' build.log || true
            echo "== END RAW OUTPUT =="
          fi
          exit "$status"

      - name: Package IPA
        if: success()
        run: |
          APP_PATH="$(find "${{ github.workspace }}/Swiftfin.xcarchive/Products/Applications" -name "*.app" -type d 2>/dev/null | head -1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built .app not found in archive"
            find "${{ github.workspace }}/Swiftfin.xcarchive" -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "== BUNDLE CONTENTS =="
          find "$APP_PATH" -maxdepth 2 | head -60
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing from built app bundle"
            exit 1
          fi
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist" 2>/dev/null || true)"
          if [ -z "$EXEC" ] || [ ! -x "$APP_PATH/$EXEC" ]; then
            echo "ERROR: executable '$EXEC' missing from built app bundle"
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH")"
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/$APP_NAME"
          ditto -c -k --sequesterRsrc --keepParent Payload Swiftfin.ipa
          ls -lh Swiftfin.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Swiftfin-chromecast
          path: Swiftfin.ipa
          retention-days: 14
