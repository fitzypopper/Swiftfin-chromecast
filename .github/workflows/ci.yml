name: "Build 🔨"

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        scheme:
          - "Swiftfin"

    runs-on: macos-15

    env:
      XCODE_VERSION: "16.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Verify GoogleCast.xcframework
        run: |
          if [ ! -d "Frameworks/GoogleCast.xcframework" ]; then
            echo "ERROR: GoogleCast.xcframework not found"
            exit 1
          fi
          echo "GoogleCast.xcframework found"
          ls -la Frameworks/GoogleCast.xcframework/

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Swiftfin.xcodeproj \
            -scheme Swiftfin \
            -destination 'generic/platform=iOS'

      - name: Build (no codesign)
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: |
            xcodebuild build \
              -project Swiftfin.xcodeproj \
              -scheme Swiftfin \
              -destination 'generic/platform=iOS' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=YES \
              -skipMacroValidation \
              | xcpretty || true
